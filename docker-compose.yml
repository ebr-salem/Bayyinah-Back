name: islamic-platform

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Islamic Content Platform}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}

  # FastAPI AI backend (must be reachable on the shared "fastapi-net" network)
  FASTAPI_INTERNAL_URL: ${FASTAPI_INTERNAL_URL:-http://fastapi-service:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  # Seeder values
  SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@ertiqaa.com}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-superadmin}
  AI_MONTHLY_LIMIT: ${AI_MONTHLY_LIMIT:-100}

  # Database (pointed at the "db" service)
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-islamic_content_platform}
  DB_USERNAME: ${DB_USERNAME:-islamic_platform}
  DB_PASSWORD: ${DB_PASSWORD:-islamic_platform}
  MYSQL_ATTR_SSL_CA: ${MYSQL_ATTR_SSL_CA:-}

  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-single}
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Islamic Content Platform}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: islamic-platform:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - fastapi-net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: islamic-platform:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-islamic_content_platform}
      MYSQL_USER: ${DB_USERNAME:-islamic_platform}
      MYSQL_PASSWORD: ${DB_PASSWORD:-islamic_platform}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default

volumes:
  db_data:

# The AI (FastAPI) service joins this shared, attachable network. Attach the
# FastAPI container on the host with:
#   docker network connect fastapi-net <fastapi-container>
networks:
  default:
  fastapi-net:
    name: fastapi-net
    driver: bridge
    attachable: true